async function openDetail(i,trigger){if(busy||!overlay.hidden)return;busy=true;activeStep=i;origin=trigger;returnFocus=trigger;renderDetail(i);pageScroll=window.scrollY;document.documentElement.style.overflow='hidden';overlay.hidden=false;reading.scrollTop=0;overview.inert=true;trigger.setAttribute('aria-expanded','true');const from=originTransform();overlay.classList.add('visible');closeButton.focus({preventScroll:true});showGestureIntro();modal.animate([{transform:from,opacity:.4},{transform:'none',opacity:1}],{duration:duration(),easing:'cubic-bezier(.2,0,0,1)'});busy=false}
